
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿墨墨打字通 - 快乐学打字</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f8fbff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .font-kids {
            font-family: 'Noto Sans SC', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-weight: 800;
        }
        .font-pinyin {
            font-family: 'Noto Sans SC', 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.08em;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes carRumble {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-1.5px) rotate(0.4deg); }
            50% { transform: translateY(0.5px) rotate(-0.3deg); }
            75% { transform: translateY(-0.8px) rotate(0.2deg); }
        }
        @keyframes exhaustPuff {
            0% { transform: scale(0.6) translateY(0); opacity: 0.9; }
            50% { transform: scale(1.3) translateY(14px); opacity: 0.6; }
            100% { transform: scale(2.0) translateY(28px); opacity: 0; }
        }
        @keyframes roadStripes {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes frogArc {
            0% { transform: scale(1) translateY(0); }
            40% { transform: scale(1.35) translateY(-24px) rotate(-8deg); }
            70% { transform: scale(1.2) translateY(-14px) rotate(4deg); }
            100% { transform: scale(1) translateY(0) rotate(0); }
        }
        /* Flowing Gold Liquid Animation */
        @keyframes goldenFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes goldGlowPulse {
            0%, 100% {
                box-shadow: 0 0 8px rgba(245, 158, 11, 0.6), 0 0 16px rgba(251, 191, 36, 0.35), inset 0 0 4px rgba(251, 191, 36, 0.5);
            }
            50% {
                box-shadow: 0 0 16px rgba(245, 158, 11, 0.9), 0 0 28px rgba(251, 191, 36, 0.65), inset 0 0 8px rgba(251, 191, 36, 0.8);
            }
        }
        /* Pet 3D Distinct Interactive Animations */
        @keyframes petChewCookie {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.1, 0.92) rotate(-4deg) translateY(2px); }
            40% { transform: scale(0.94, 1.08) rotate(4deg) translateY(-2px); }
            60% { transform: scale(1.08, 0.94) rotate(-3deg) translateY(1px); }
            80% { transform: scale(0.96, 1.04) rotate(2deg) translateY(-1px); }
        }
        @keyframes petGulpFish {
            0% { transform: scale(1) translateY(0); }
            25% { transform: scale(0.85, 1.25) translateY(-28px) rotate(-8deg); }
            55% { transform: scale(1.2, 0.85) translateY(4px) rotate(6deg); }
            75% { transform: scale(1.08, 0.95) translateY(-8px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes petPlumpBurger {
            0% { transform: scale(1); }
            30% { transform: scale(1.3, 1.22) translateY(-10px); }
            60% { transform: scale(1.18, 1.26) translateY(-4px); }
            85% { transform: scale(1.24, 1.16) translateY(-6px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes petCakeSpin {
            0% { transform: scale(1) rotate(0deg); }
            40% { transform: scale(1.25) rotate(180deg) translateY(-16px); }
            70% { transform: scale(1.15) rotate(360deg) translateY(-8px); }
            100% { transform: scale(1) rotate(360deg) translateY(0); }
        }
        @keyframes petLickIcecream {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.06) rotate(-10deg) translateY(-3px); }
            40% { transform: scale(1.06) rotate(10deg) translateY(-3px); }
            60% { transform: scale(1.04) rotate(-6deg) translateY(-2px); }
            80% { transform: scale(1.04) rotate(6deg) translateY(-2px); }
        }
        @keyframes petFeastBurst {
            0% { transform: scale(0.9) translateY(0); }
            25% { transform: scale(1.35) translateY(-24px) rotate(8deg); }
            50% { transform: scale(1.25) translateY(-12px) rotate(-8deg); }
            75% { transform: scale(1.3) translateY(-18px) rotate(4deg); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes floatFoodParticle {
            0% { transform: scale(0.5) translateY(0) rotate(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-60px) rotate(45deg); opacity: 0; }
        }

        .animate-car-rumble {
            animation: carRumble 0.14s infinite ease-in-out;
        }
        .animate-exhaust-puff {
            animation: exhaustPuff 0.6s infinite ease-out;
        }
        .animate-frog-arc {
            animation: frogArc 0.45s ease-out;
        }
        .animate-pet-chew {
            animation: petChewCookie 0.85s ease-in-out;
        }
        .animate-pet-gulp {
            animation: petGulpFish 1.1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .animate-pet-burger {
            animation: petPlumpBurger 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .animate-pet-cake {
            animation: petCakeSpin 1.1s ease-in-out;
        }
        .animate-pet-icecream {
            animation: petLickIcecream 1.0s ease-in-out;
        }
        .animate-pet-feast {
            animation: petFeastBurst 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .animate-food-float {
            animation: floatFoodParticle 0.9s ease-out forwards;
        }

        /* Flowing Light Border around Word Pill (Zero layout shift, high legibility) */
        @keyframes borderFlowGlow {
            0% {
                box-shadow: 0 0 0 2px #f59e0b, 0 0 10px rgba(245, 158, 11, 0.75);
            }
            25% {
                box-shadow: 0 0 0 2px #f97316, 0 0 12px rgba(249, 115, 22, 0.75);
            }
            50% {
                box-shadow: 0 0 0 2px #eab308, 0 0 14px rgba(234, 179, 8, 0.85);
            }
            75% {
                box-shadow: 0 0 0 2px #10b981, 0 0 10px rgba(16, 185, 129, 0.75);
            }
            100% {
                box-shadow: 0 0 0 2px #f59e0b, 0 0 10px rgba(245, 158, 11, 0.75);
            }
        }

        /* Flowing Gold Card Border */
        .flowing-gold-card {
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #fef08a, #d97706, #fbbf24, #f59e0b) !important;
            background-size: 300% 300% !important;
            animation: goldenFlow 2.2s linear infinite, goldGlowPulse 1.8s ease-in-out infinite !important;
        }
        /* Flowing Border Word Box in Story (Crisp text, zero word displacement, circulating light) */
        .flowing-gold-pill,
        .flowing-word-box {
            background-color: #ffffff !important;
            color: #0f172a !important;
            font-weight: 800 !important;
            animation: borderFlowGlow 1.8s linear infinite !important;
            border-color: transparent !important;
            transform: none !important;
            z-index: 10 !important;
        }
    </style>
<script type="importmap">
{

  }
}
</script>

</head>

</html>
